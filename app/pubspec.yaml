name: majlis
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  audioplayers: ^6.8.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/avatars/
    - assets/avatars/anim/falconer/
    - assets/avatars/anim/assassin/
    - assets/avatars/anim/astronaut/
    - assets/avatars/anim/champ1/
    - assets/avatars/anim/champ2/
    - assets/avatars/anim/champ3/
    - assets/avatars/anim/emir/
    - assets/avatars/anim/falcon_bird/
    - assets/avatars/anim/ghost/
    - assets/avatars/anim/knight/
    - assets/avatars/anim/lady_gold/
    - assets/avatars/anim/lv20/
    - assets/avatars/anim/lv30/
    - assets/avatars/anim/lv40/
    - assets/avatars/anim/lv50/
    - assets/avatars/anim/pilot/
    - assets/avatars/anim/queen/
    - assets/avatars/anim/s1a/
    - assets/avatars/anim/s1b/
    - assets/avatars/anim/s1c/
    - assets/avatars/anim/seer/
    - assets/avatars/anim/sultana/
    - assets/avatars/anim/tycoon/
    - assets/avatars/anim/wolf/
    - assets/images/
    - assets/design/
    - assets/icons/
    - assets/voice/
    - assets/sfx/
    - assets/music/
    - assets/tables/
    - assets/stickers/

  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Regular.ttf
        - asset: assets/fonts/ElMessiri-Bold.ttf
          weight: 700
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
