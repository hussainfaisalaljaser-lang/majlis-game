# فحص السرعة بعد كل رفع للسيرفر: لعبة تدريب قصيرة على السيرفر الحقيقي، ونقيس كل طلب (functions/test/speedcheck.ts).
# النتيجة تطلع ملاحظات في صفحة التشغيل.
name: Speed check

on:
  workflow_run:
    workflows: ['Deploy server']
    types: [completed]
  workflow_dispatch:

jobs:
  speed:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: functions
        run: npm ci
      - name: Speed check
        working-directory: functions
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx tsx test/speedcheck.ts || echo "::warning::فحص السرعة ما كمل"
          rm "$RUNNER_TEMP/sa.json"
