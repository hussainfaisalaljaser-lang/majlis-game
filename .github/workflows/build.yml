# كل مرة ينحفظ شغل: نشغّل الاختبارات ونبني ملف APK تقدر تحمّله على جوالك من صفحة Releases.
name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        working-directory: engine
        run: npm ci && npm test
      - name: Server build and tests
        working-directory: functions
        run: npm ci && npm run build && npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Analyze
        working-directory: app
        run: flutter pub get && flutter analyze
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Rename
        run: cp app/build/app/outputs/flutter-apk/app-release.apk majlis-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: majlis-apk
          path: majlis-${{ github.run_number }}.apk
      # نسخة تجريبية في Releases، عشان تحمّلها من جوالك بسهولة.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: majlis-${{ github.run_number }}.apk
          body: |
            نسخة تجريبية من فرع `${{ github.ref_name }}`.
            حمّل ملف الـ APK وافتحه على جوالك (يمكن يطلب منك تسمح بتثبيت التطبيقات من مصادر غير معروفة).
