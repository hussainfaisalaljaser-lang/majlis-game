# كل مرة ينحفظ شغل: نشغّل الاختبارات ونبني ملف APK تقدر تحمّله على جوالك من صفحة Releases.
name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        working-directory: engine
        run: npm ci && npm test
      - name: Server build and tests
        working-directory: functions
        run: npm ci && npm run build && npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      # مفتاح الرفع لـ Google Play موجود؟ (الأسرار ما تنقرا مباشرة في شروط الخطوات)
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Analyze
        working-directory: app
        run: flutter pub get && flutter analyze
      - name: App tests
        working-directory: app
        run: flutter test
      # رقم البناء يزيد كل مرة (Google Play يشترطه)، ويطلع في الإعدادات داخل اللعبة.
      # للجوالات بس (بدون نسخة محاكي الكمبيوتر)، ومكتبات التشغيل مضغوطة (compressLibs): حوالي ٣٠ ميقا بدال ٧٦.
      - name: Build APK
        working-directory: app
        run: >-
          flutter build apk --release --target-platform android-arm,android-arm64 -P compressLibs=true
          --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
      # نسخة برقمها، ونسخة باسم ثابت (majlis.apk) عشان رابط التحميل في الموقع ما يتغير.
      - name: Rename
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk majlis-${{ github.run_number }}.apk
          cp app/build/app/outputs/flutter-apk/app-release.apk majlis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: majlis-apk
          path: majlis-${{ github.run_number }}.apk
      # ملف المتجر (AAB): بس في main ولما يكون مفتاح الرفع موجود في GitHub Secrets.
      - name: Build AAB for Google Play
        if: github.ref_name == 'main' && env.HAS_UPLOAD_KEY == 'true'
        working-directory: app
        env:
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}
          rm "$RUNNER_TEMP/upload.keystore"
      - name: Upload AAB
        if: github.ref_name == 'main' && env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: majlis-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
      # نسخة في Releases تحمّلها من جوالك. نسخ main هي "الأحدث"، فرابط
      # releases/latest/download/majlis.apk (في صفحة الدعوة) يعطي دايم آخر نسخة منها.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخة تجريبية ${{ github.run_number }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          target_commitish: ${{ github.sha }}
          files: |
            majlis-${{ github.run_number }}.apk
            majlis.apk
          body: |
            نسخة تجريبية من فرع `${{ github.ref_name }}`.
            حمّل ملف الـ APK وافتحه على جوالك (يمكن يطلب منك تسمح بتثبيت التطبيقات من مصادر غير معروفة).
