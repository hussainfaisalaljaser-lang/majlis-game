# رفع السيرفر (Cloud Functions) وقواعد الأمان والفهارس إلى Firebase.
# يحتاج خطة Blaze، وسر في GitHub اسمه FIREBASE_SERVICE_ACCOUNT (محتوى ملف مفتاح حساب الخدمة).
name: Deploy server

on:
  push:
    branches: [main]
    paths: ['engine/**', 'functions/**', 'firestore.rules', 'firestore.indexes.json', 'firebase.json']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::أضف السر FIREBASE_SERVICE_ACCOUNT في إعدادات المستودع (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Install
        working-directory: functions
        run: npm ci
      - name: Deploy
        working-directory: functions
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # دوال قديمة ما عاد نحتاجها، وفايربيس ما يقدر يشيلها لحاله (مثل الجدولة اللي تحتاج صلاحية ما عندنا).
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/sa.json" --quiet
          for f in weeklyChampions; do
            gcloud functions delete "$f" --gen2 --region europe-west1 --project majlis-game-1d739 --quiet 2>&1 || true
          done
          set +e
          npx firebase deploy --only functions,firestore:rules,firestore:indexes --project majlis-game-1d739 --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          code=${PIPESTATUS[0]}
          rm "$RUNNER_TEMP/sa.json"
          # آخر سطور الخطأ تطلع كملاحظات في صفحة التشغيل، عشان نعرف السبب بسرعة.
          if [ "$code" -ne 0 ]; then
            # GitHub يعرض ١٠ ملاحظات بس، فنجمع آخر السطور في ملاحظة وحدة.
            tail_log=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log" | grep -v '^\s*$' | tail -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error::${tail_log}"
          fi
          exit "$code"
