# صوت الراوي: يولّد عينات الأصوات أو كل جمل اللعبة. المزود الأساسي ElevenLabs (صوت خليجي)،
# وقوقل احتياط. يشتغل يدوي من صفحة Actions. الملفات ترتفع على فرع voice-output.
name: Narrator voice

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'elevenlabs أو google'
        default: elevenlabs
      mode:
        description: 'samples = عينة لكل صوت، preview = جمل مختارة بأدائين، lines = كل الجمل'
        default: samples
      voice:
        description: 'samples: أرقام الأصوات مفصولة بفاصلة. lines: رقم صوت واحد'
        default: ''

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Generate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'elevenlabs' }}
          MODE: ${{ inputs.mode || 'samples' }}
          VOICE: ${{ inputs.voice || '' }}
        run: |
          if [ "$PROVIDER" = elevenlabs ]; then
            if [ -z "$ELEVENLABS_API_KEY" ]; then
              echo "::error::أضف السر ELEVENLABS_API_KEY في Settings → Secrets and variables → Actions"
              exit 1
            fi
            case "$MODE" in
              lines) python tools/voice/eleven.py lines "$VOICE" out/voice ;;
              preview) python tools/voice/eleven.py preview "$VOICE" out/preview ;;
              experiment) python tools/voice/eleven.py experiment "$VOICE" out/experiment ;;
              *) python tools/voice/eleven.py samples "$VOICE" out/samples ;;
            esac
          else
            echo "$SA" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            if [ "$MODE" = lines ]; then python tools/voice/tts.py lines "$VOICE" out/voice
            else python tools/voice/tts.py samples out/samples; fi
            rm "$RUNNER_TEMP/sa.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: out
      # نرفع الملفات كمان على فرع voice-output، عشان نقدر نسحبها بـ git
      - name: Push to voice-output branch
        run: |
          cd out
          git init -q -b voice-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Narrator audio from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-output
